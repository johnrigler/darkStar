<figure class="bell-tract"><img src="theBell2024/panel1.png" alt="The Bell, panel 1"><figcaption><strong>The King's Paper</strong><p>Every morning the boy carried the king's paper from door to door. It announced another tax—on bread, on shoes, on whatever the king had noticed last.</p><p>That morning the boy carried a second sheet, written in his own hand: <em>NO TAXES.</em> He believed a true sentence would make people stop.</p></figcaption></figure>
<pre class="lorem panel-notes">The street is bright and ordinary. The paper has begun its walk, but
the town does not yet know that it is being addressed.</pre></main></body></html>
