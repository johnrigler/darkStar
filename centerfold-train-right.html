<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dark Star — train centerfold right</title>
  <link rel="stylesheet" href="centerfold.css">
</head>
<body class="centerfold-page" data-half="right" style="--train-top:3.45in;--train-height:4.09in;">
  <main class="centerfold-field">
    <p class="centerfold-kicker">past the fold</p>
    <img class="train-art"
         src="train-centerfold.png"
         alt="Dark Star desert freight train crossing the centerfold with blockchain cutaway cars and graffiti"
         onerror="this.style.display='none';this.nextElementSibling.hidden=false">
    <span class="asset-note" hidden>train-centerfold.png</span>
    <span class="fold-shadow" aria-hidden="true"></span>
  </main>
</body>
</html>
