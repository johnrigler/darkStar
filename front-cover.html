<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dark Star — front cover</title>
  <link rel="stylesheet" href="page.css">
  <style>
    body.front-cover {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 0.34in;
      overflow: hidden;
      background: #fff;
      color: #0a0a0a;
    }

    .cover-frame {
      position: absolute;
      inset: 0.18in;
      border: 1.5pt solid currentColor;
      pointer-events: none;
    }

    .cover-frame::before {
      content: "";
      position: absolute;
      inset: 0.07in;
      border: 0.5pt solid currentColor;
    }

    .cover-header {
      position: relative;
      z-index: 1;
      padding: 0.17in 0.2in 0;
    }

    .cover-title {
      margin: 0;
      font-family: "Courier New", Courier, monospace;
      font-size: 52pt;
      font-weight: 700;
      line-height: 0.84;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .cover-title span {
      display: block;
    }

    .cover-title span:last-child {
      margin-left: 0.52in;
    }

    .cover-kicker {
      margin: 0.17in 0 0 0.07in;
      font-family: "Courier New", Courier, monospace;
      font-size: 8pt;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .cover-art {
      align-self: center;
      justify-self: center;
      width: 5.75in;
      height: 4.65in;
      margin-top: -0.08in;
    }

    .cover-art .orbit,
    .cover-art .axis {
      fill: none;
      stroke: #0a0a0a;
      vector-effect: non-scaling-stroke;
    }

    .cover-art .orbit {
      stroke-width: 1.15;
    }

    .cover-art .axis {
      stroke-width: 0.6;
      stroke-dasharray: 3 7;
    }

    .cover-art .star-rays {
      fill: #0a0a0a;
    }

    .cover-art .star-core {
      fill: #111c46;
      stroke: #0a0a0a;
      stroke-width: 3;
    }

    .cover-art .small-star {
      fill: #0a0a0a;
    }

    .cover-footer {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 0.25in;
      padding: 0 0.2in 0.17in;
    }

    .cover-note {
      margin: 0;
      font-size: 8pt;
      line-height: 1.35;
      letter-spacing: 0.08em;
    }

    .cover-author {
      margin: 0;
      font-family: "Courier New", Courier, monospace;
      font-size: 14pt;
      font-weight: 700;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    @media print {
      body.front-cover {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
<body class="front-cover">
  <div class="cover-frame" aria-hidden="true"></div>

  <header class="cover-header">
    <h1 class="cover-title"><span>Dark</span><span>Star</span></h1>
    <p class="cover-kicker">A work in an unstable universe</p>
  </header>

  <svg class="cover-art" viewBox="0 0 600 480" role="img"
       aria-label="A dark blue star surrounded by elliptical orbital lines">
    <line class="axis" x1="50" y1="240" x2="550" y2="240"/>
    <line class="axis" x1="300" y1="32" x2="300" y2="448"/>

    <ellipse class="orbit" cx="300" cy="240" rx="252" ry="92"
             transform="rotate(-14 300 240)"/>
    <ellipse class="orbit" cx="300" cy="240" rx="238" ry="68"
             transform="rotate(34 300 240)"/>
    <ellipse class="orbit" cx="300" cy="240" rx="194" ry="54"
             transform="rotate(78 300 240)"/>

    <path class="star-rays" d="
      M300 52 L323 164 L377 80 L369 186 L468 124 L393 207
      L512 194 L405 234 L520 272 L399 266 L480 356 L382 289
      L404 416 L340 310 L300 448 L275 316 L212 408 L233 297
      L126 360 L207 274 L80 286 L197 242 L88 190 L213 210
      L132 120 L231 187 L208 62 L274 170 Z"/>

    <circle class="star-core" cx="300" cy="240" r="77"/>
    <circle cx="276" cy="215" r="13" fill="#fff"/>
    <circle class="small-star" cx="94" cy="106" r="4"/>
    <circle class="small-star" cx="507" cy="85" r="3"/>
    <circle class="small-star" cx="529" cy="393" r="5"/>
    <circle class="small-star" cx="92" cy="392" r="3"/>
  </svg>

  <footer class="cover-footer">
    <pre class="cover-note">AN EXPERIMENTAL
WORK OF COMIC FICTION</pre>
    <p class="cover-author">JOHN RIGLER</p>
  </footer>
</body>
</html>
