<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dark Star — front cover</title>
  <link rel="stylesheet" href="page.css">
  <style>
    html,
    body.front-cover {
      margin: 0;
      padding: 0;
      width: 7in;
      height: 8.5in;
      overflow: hidden;
      background: #050505;
    }

    body.front-cover {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cover-image {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
    }

    @media print {
      body.front-cover {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
<body class="front-cover">
  <!--
    HIDDEN MYTHOS

    Dark Star is Saturn: time, winter, limit, recurrence and return.
    Saturnalia is the inversion: hierarchy loosens and value turns over.
    Vico supplies the ricorso: history returns in altered form.
    Apuk / Ah Pook / Ah Puch enters through the Burroughs layer as death,
    rot and the exposure of false permanence.
    The Fourth Turning is a contemporary speculative lens, not a law.
    The post-collapse tools are artifacts built in one order that remain
    usable when the enclosing platform or institution is gone.
  -->
  <img class="cover-image" src="cover-dark-star.jpg"
       alt="Dark Star cover: a glyph mosaic of Saturn, rings, cycles, and ricorso">
</body>
</html>
