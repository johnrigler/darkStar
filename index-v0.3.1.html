    <p>The ledger does not know what money is. It records valid transactions according to protocol rules. Humans assign economic meaning to some of the fields. The underlying system is more general: an ordered, replicated, difficult-to-rewrite history among parties who do not share a central authority.</p>

    <h3>Beyond permission</h3>
    <p>There may be practical gates—software, fees, explorers that hide data, governments, companies. But none of these is identical to control of the ledger itself. To make the underlying capability disappear one would have to eliminate every usable implementation, every reachable node, every copy of the chain. That is not a realistic control strategy.</p>

let spread = 0;

function colorizeAddresses(root) {
  const source = root.querySelector("#addresses");
  if (!source) return;
  const fallThrough = "9sSADXANDXWEARYXiXGoXBACKZZZc6o8QR";
  function part(text, className) {
    const span = document.createElement("span");
    span.className = className;
    span.textContent = text;
    return span;
  }
  const addresses = source.textContent.trim().split(/\s+/);
  source.replaceChildren();
  addresses.forEach((address, addressIndex) => {
    if (address === fallThrough) {
      source.append(address);
    } else {
      source.append(part(address.slice(0, 2), "mac-prefix"));
      for (const character of address.slice(2, -6)) {
        let className = "mac-payload";
        if (character === "x" || character === "X") className = "mac-space";
        else if ("hvay".includes(character)) className = "mac-punctuation";
        else if (character === "z") className = "mac-padding";
        source.append(part(character, className));
      }
      source.append(part(address.slice(-6), "mac-checksum"));
    }
    if (addressIndex < addresses.length - 1) source.append("\n");
  });
}

function render() {
  const leftIdx = spread;
  const rightIdx = spread + 1;
  const total = pages.length;
  document.getElementById("num-left").textContent = leftIdx + 1;
  document.getElementById("num-right").textContent = rightIdx < total ? rightIdx + 1 : "—";
  document.getElementById("page-label").textContent =
    rightIdx < total ? (leftIdx + 1) + " – " + (rightIdx + 1) : String(leftIdx + 1);
  fill("inner-left", pages[leftIdx]);
  if (rightIdx < total) {
    fill("inner-right", pages[rightIdx]);
  } else {
    fill("inner-right", { type: "html", html: '<div class="blank-page">—</div>' });
  }
  document.getElementById("page-right").style.visibility = "visible";
  document.getElementById("btn-prev").disabled = spread <= 0;
  document.getElementById("btn-next").disabled = spread + 2 >= total;
}

function fill(id, page) {
  const el = document.getElementById(id);
  if (!page) { el.innerHTML = ""; return; }
  if (page.type === "preface") {
    el.innerHTML = PREFACE_HTML;
    colorizeAddresses(el);
  } else {
    el.innerHTML = page.html;
  }
}

document.getElementById("btn-prev").addEventListener("click", function () {
  if (spread >= 2) { spread -= 2; render(); }
  else if (spread === 1) { spread = 0; render(); }
});
document.getElementById("btn-next").addEventListener("click", function () {
  if (spread + 2 < pages.length) { spread += 2; render(); }
});
document.addEventListener("keydown", function (e) {
  if (e.key === "ArrowLeft") document.getElementById("btn-prev").click();
  if (e.key === "ArrowRight") document.getElementById("btn-next").click();
});


render();
