<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dark Star vNext</title>
<link rel="stylesheet" href="style.css?v=vnext-1">
<link rel="stylesheet" href="cover-spread.css?v=vnext-1">
<link rel="stylesheet" href="single-page.css?v=1">
</head>
<body>
<main id="spread" aria-label="Dark Star vNext page spread">
  <div id="page-left-slot" class="page-slot">
    <iframe id="page-left" class="page" title="Left page"></iframe>
    <aside id="cover-info" aria-label="Dark Star vNext information">
      <div class="cover-info-inner">
        <p class="cover-info-kicker">essay + field manual + executable publication</p>
        <h1>DARK STAR</h1>
        <p class="cover-info-copy">vNext now opens with the four-chapter Dark Star argument. Earlier essay/lab pages remain available as an optional appendix.</p>
        <div class="cover-info-links">
          <p><strong>Edition</strong><br>
            <button id="appendix-off" type="button">Core chapters</button>
            <button id="appendix-on" type="button">Core + archive appendix</button>
          </p>
        </div>
        <div class="cover-info-links">
          <p><strong>Source</strong><br><a href="https://github.com/johnrigler/darkStar" target="_blank" rel="noopener">github.com/johnrigler/darkStar</a></p>
          <p><strong>Old viewer</strong><br><a href="index.html">index.html</a></p>
        </div>
      </div>
    </aside>
  </div>
  <div id="page-right-slot" class="page-slot">
    <iframe id="page-right" class="page" title="Right page"></iframe>
  </div>
</main>
<div id="turn-left" class="turn-zone turn-left" aria-label="Previous spread"></div>
<div id="turn-right" class="turn-zone turn-right" aria-label="Next spread"></div>
<script src="book-vnext.js?v=vnext-2"></script>
<script>
(() => {
  function setAppendix(value) {
    const url = new URL(window.location.href);
    url.searchParams.set("appendix", value ? "1" : "0");
    url.searchParams.delete("page");
    window.location.href = url.toString();
  }
  document.getElementById("appendix-off")?.addEventListener("click", () => setAppendix(false));
  document.getElementById("appendix-on")?.addEventListener("click", () => setAppendix(true));
})();
</script>
<script src="viewer.js?v=single-1"></script>
</body>
</html>
