<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dark Star</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <main id="spread" aria-label="Dark Star page spread">
    <div id="page-left-slot" class="page-slot">
      <iframe id="page-left" class="page" title="Left page"></iframe>
    </div>
    <div id="page-right-slot" class="page-slot">
      <iframe id="page-right" class="page" title="Right page"></iframe>
    </div>
  </main>

  <div id="turn-left" class="turn-zone turn-left" aria-label="Previous spread"></div>
  <div id="turn-right" class="turn-zone turn-right" aria-label="Next spread"></div>

  <script src="book.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
