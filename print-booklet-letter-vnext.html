<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dark Star vNext Letter Booklet</title>
<link rel="stylesheet" href="print.css">
<style>@page{size:letter landscape;margin:0}</style>
</head>
<body class="booklet-preview letter-booklet-preview" data-print-mode="booklet">
<aside class="print-help">
<strong>Dark Star vNext</strong>
<span id="edition-count"></span>
<span>US Letter landscape, duplex, flip short edge.</span>
<span><a href="?appendix=0">core chapters</a> · <a href="?appendix=1">core + archive appendix</a></span>
</aside>
<main id="print-document" aria-label="Dark Star vNext Letter print job"></main>
<script src="book-vnext.js?v=vnext-2"></script>
<script>
(() => {
  const count = window.DARK_STAR_BOOK.pages.length;
  const padded = Math.ceil(count / 4) * 4;
  const sheets = padded / 4;
  const label = window.DARK_STAR_BOOK.includeAppendix ? "core + archive appendix" : "core chapters";
  document.getElementById("edition-count").textContent =
    `${count} authored pages · ${sheets} folded sheets after booklet padding · ${label}`;
})();
</script>
<script src="print-random.js"></script>
<script src="print.js"></script>
<script src="letter-layout.js"></script>
</body>
</html>
