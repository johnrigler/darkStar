<body class="booklet-preview" data-print-mode="booklet">
  <aside class="print-help">
    <strong>17×11 one-fold booklet</strong>
    <span>Print at 100%, landscape, two-sided, flip on short edge.</span>
    <span>Use no margins, turn headers and footers off, and enable background graphics.</span>
    <span>The job pads itself to a multiple of four pages and imposes every sheet in folding order.</span>
  </aside>

  <main id="print-document" aria-label="Dark Star imposed booklet print job"></main>
